        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --black: #0a0a0a;
                --white: #f0ede8;
                --red: #f1ee75;
                --gray: #2a2a2a;
                --mid: #5a5a5a;
                --light: #b0aa9f;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                background: var(--black);
                color: var(--white);
                font-family: "Space Mono", monospace;
                overflow-x: hidden;
                cursor: crosshair;
                min-height: 100vh;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
                opacity: 0.04;
                pointer-events: none;
                z-index: 9999;
            }

            body::after {
                content: "";
                position: fixed;
                inset: 0;
                background: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.03) 2px,
                    rgba(0, 0, 0, 0.03) 4px
                );
                pointer-events: none;
                z-index: 9998;
            }

            .nav {
                position: relative;
                z-index: 10;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 2rem 3rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .nav-logos {
                display: flex;
                align-items: center;
                gap: 1.5rem;
            }

            .logo-adjara {
                height: 54px;
                width: auto;
                filter: invert(1) brightness(0.7);
                opacity: 0.85;
                transition: opacity 0.2s ease;
            }
            .logo-adjara:hover {
                opacity: 1;
            }

            .logo-geolab {
                height: 54px;
                width: auto;
                filter: brightness(0.7);
                opacity: 0.85;
                transition: opacity 0.2s ease;
            }
            .logo-geolab:hover {
                opacity: 1;
            }

            .logo-art {
                height: 38px;
                width: auto;
                filter: brightness(0.7);
                opacity: 0.85;
                transition: opacity 0.2s ease;
            }
            .logo-art:hover {
                opacity: 1;
            }

            .back-link {
                font-family: "Space Mono", monospace;
                font-size: 0.65rem;
                letter-spacing: 0.2em;
                color: var(--mid);
                text-decoration: none;
                text-transform: uppercase;
                transition: color 0.2s;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            .back-link:hover {
                color: var(--red);
            }
            .back-link::before {
                content: "←";
            }

            .gallery-page {
                padding: 4rem 3rem 6rem;
                border-bottom: 1px solid var(--gray);
            }

            .gallery-intro {
                display: grid;
                grid-template-columns: 1.2fr auto;
                gap: 2rem;
                align-items: end;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                padding-bottom: 1.5rem;
                margin-bottom: 2rem;
            }

            .gallery-kicker {
                font-family: "Space Mono", monospace;
                font-size: 0.58rem;
                letter-spacing: 0.28em;
                color: var(--red);
                text-transform: uppercase;
            }

            .gallery-title {
                margin-top: 0.5rem;
                font-family: "Bebas Neue", sans-serif;
                font-size: clamp(2.2rem, 5vw, 4rem);
                letter-spacing: 0.08em;
                color: var(--white);
            }

            .gallery-author {
                font-family: "Space Mono", monospace;
                font-size: 0.65rem;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--light);
                line-height: 1.6;
                margin-top: 2rem;
            }

            .gallery-author span {
                display: block;
                color: var(--white);
                font-size: 1rem;
                margin-top: 0.5rem;
                letter-spacing: 0.05em;
            }

            .gallery-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
                gap: 1.5rem;
                margin-top: 3rem;
            }

            .gallery-item {
                position: relative;
                border: 1px solid rgba(255, 255, 255, 0.08);
                overflow: hidden;
                background: #121212;
                aspect-ratio: 3 / 4;
                cursor: crosshair;
            }

            .gallery-item img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                filter: grayscale(10%) contrast(1.05);
                transition:
                    transform 0.6s cubic-bezier(0.23, 1, 0.32, 1),
                    filter 0.4s ease;
            }

            .gallery-item:hover img {
                transform: scale(1.02);
                filter: grayscale(0%) contrast(1.1);
            }

            .gallery-item::after {
                content: "Photo by Shotiko Tsikurishvili";
                position: absolute;
                left: 1rem;
                bottom: 1rem;
                font-family: "Space Mono", monospace;
                font-size: 0.5rem;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--white);
                background: rgba(0, 0, 0, 0.6);
                padding: 0.4rem 0.8rem;
                opacity: 0;
                transition: opacity 0.3s ease;
                pointer-events: none;
                z-index: 2;
            }

            .gallery-item:hover::after {
                opacity: 1;
            }

            .back-to-top-wrap {
                margin-top: 3rem;
                display: flex;
                justify-content: center;
            }

            .back-to-top-btn {
                display: inline-block;
                font-family: "Bebas Neue", sans-serif;
                font-size: 1rem;
                letter-spacing: 0.24em;
                color: var(--black);
                background: var(--red);
                padding: 0.9rem 1.8rem;
                text-decoration: none;
                border: 1px solid rgba(241, 238, 117, 0.9);
                clip-path: polygon(
                    0 0,
                    calc(100% - 12px) 0,
                    100% 12px,
                    100% 100%,
                    12px 100%,
                    0 calc(100% - 12px)
                );
                transition:
                    transform 0.2s ease,
                    box-shadow 0.25s ease;
                box-shadow: 0 0 0 rgba(241, 238, 117, 0.35);
            }

            .back-to-top-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 0 16px rgba(241, 238, 117, 0.4);
            }

            footer {
                padding: 3rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-top: 1px solid var(--gray);
            }

            .footer-logo-text {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.5rem;
                letter-spacing: 0.2em;
                color: var(--white);
            }

            .footer-orgs {
                display: flex;
                align-items: center;
                gap: 2rem;
            }

            .footer-logo-adjara {
                height: 60px;
                width: auto;
                filter: invert(1) brightness(0.5);
                opacity: 0.6;
                transition: opacity 0.2s ease;
            }
            .footer-logo-adjara:hover {
                opacity: 0.9;
            }

            .footer-logo-geolab {
                height: 60px;
                width: auto;
                filter: brightness(0.5);
                opacity: 0.6;
                transition: opacity 0.2s ease;
            }
            .footer-logo-geolab:hover {
                opacity: 0.9;
            }

            .footer-logo-art {
                height: 44px;
                width: auto;
                filter: brightness(0.5);
                opacity: 0.6;
                transition: opacity 0.2s ease;
            }
            .footer-logo-art:hover {
                opacity: 0.9;
            }

            .footer-credit {
                font-family: "Space Mono", monospace;
                font-size: 0.6rem;
                color: var(--mid);
                letter-spacing: 0.15em;
                text-align: right;
                line-height: 2;
            }

            .footer-contact {
                font-family: "Space Mono", monospace;
                font-size: 0.65rem;
                letter-spacing: 0.1em;
                color: var(--light);
                margin-top: 1rem;
            }

            .footer-contact a {
                color: var(--red);
                text-decoration: none;
                transition: opacity 0.2s ease;
            }
            .footer-contact a:hover {
                opacity: 0.8;
            }

            .lightbox {
                display: none;
                position: fixed;
                z-index: 100000;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(10, 10, 10, 0.95);
                backdrop-filter: blur(4px);
                align-items: center;
                justify-content: center;
            }

            .lightbox-content {
                max-width: 90%;
                max-height: 90vh;
                object-fit: contain;
                box-shadow: 0 0 20px rgba(241, 238, 117, 0.05);
            }

            .lightbox-btn {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                color: var(--mid);
                border: none;
                font-size: 2rem;
                padding: 1rem;
                cursor: crosshair;
                z-index: 100001;
                transition:
                    color 0.2s,
                    transform 0.2s;
            }
            .lightbox-btn:hover {
                color: var(--white);
                transform: translateY(-50%) scale(1.1);
            }
            .lightbox-prev {
                left: 2rem;
            }
            .lightbox-next {
                right: 2rem;
            }

            .lightbox-close {
                position: absolute;
                top: 2rem;
                right: 2rem;
                background: none;
                border: none;
                color: var(--red);
                font-family: "Space Mono", monospace;
                font-size: 1rem;
                cursor: crosshair;
                transition:
                    color 0.2s ease,
                    transform 0.2s ease;
                letter-spacing: 0.1em;
                z-index: 100001;
            }
            .lightbox-close:hover {
                color: var(--white);
                transform: scale(1.1);
            }

            @media (max-width: 768px) {
                .nav {
                    padding: 1.5rem;
                    flex-wrap: wrap;
                    gap: 1rem;
                }
                .gallery-page {
                    padding: 3rem 1.5rem 5rem;
                }
                .gallery-intro {
                    grid-template-columns: 1fr;
                    align-items: start;
                }
                .gallery-author {
                    text-align: left;
                }
                .gallery-grid {
                    grid-template-columns: 1fr;
                }
                footer {
                    flex-direction: column;
                    gap: 2rem;
                    text-align: center;
                }
                .footer-credit {
                    text-align: center;
                }
                .lightbox-prev {
                    left: 0.5rem;
                }
                .lightbox-next {
                    right: 0.5rem;
                }
                .lightbox-close {
                    top: 1rem;
                    right: 1rem;
                }
            }
        </style>
